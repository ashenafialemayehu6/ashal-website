
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASHAL Review - Admin Publisher</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      background-color: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h2 { color: #ffb703; margin-top: 0; }
    label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.9em; }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      background: #252525;
      border: 1px solid #3d3d3d;
      border-radius: 6px;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #ffb703;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1em;
    }
    button:hover { background: #fb8500; }
    #login-screen { text-align: center; }
    #admin-panel { display: none; }
    #status-msg { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <!-- PASSCODE GATEKEEP SCREEN -->
  <div id="login-screen">
    <h2>🔒 Admin Authentication</h2>
    <p style="color: #aaa; font-size: 0.9em;">Enter your admin passcode to unlock publisher controls.</p>
    <input type="password" id="passcode-input" placeholder="Enter Passcode">
    <button onclick="checkPasscode()">Unlock Portal</button>
    <div id="login-error" style="color: #ff4d4d; margin-top: 10px; font-size: 0.85em;"></div>
  </div>

  <!-- PUBLISHER FORM PANEL -->
  <div id="admin-panel">
    <h2>ASHAL Review Publisher</h2>
    
    <label>Supabase URL</label>
    <input type="text" id="supabase-url" placeholder="https://xyz.supabase.co">

    <label>Supabase Anon Key</label>
    <input type="password" id="supabase-key" placeholder="eyJ...">

    <hr style="border-color: #333; margin-top: 20px;">

    <label>Rule Number</label>
    <input type="text" id="rule-no" placeholder="e.g. Rule #01">

    <label>Category</label>
    <input type="text" id="category" placeholder="e.g. Core Theory">

    <label>Title</label>
    <input type="text" id="title" placeholder="Entry Title">

    <label>Content</label>
    <textarea id="content" rows="4" placeholder="Write entry content here..."></textarea>

    <label>Rating</label>
    <input type="text" id="rating" placeholder="10/10">

    <label>Status</label>
    <select id="status">
      <option value="Active">Active</option>
      <option value="Draft">Draft</option>
      <option value="Archived">Archived</option>
    </select>

    <button onclick="publishEntry()">Publish to Live Site</button>
    <div id="status-msg"></div>
  </div>
</div>

<script>
  // YOUR SECRET PASSCODE
  const SECRET_PASSCODE = "1234";

  function checkPasscode() {
    const input = document.getElementById('passcode-input').value;
    const errorDiv = document.getElementById('login-error');

    if (input === SECRET_PASSCODE) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
    } else {
      errorDiv.innerText = "Incorrect passcode. Access denied.";
    }
  }

  async function publishEntry() {
    const url = document.getElementById('supabase-url').value.trim();
    const key = document.getElementById('supabase-key').value.trim();
    const statusMsg = document.getElementById('status-msg');

    if (!url || !key) {
      statusMsg.style.color = '#ff4d4d';
      statusMsg.innerText = "Please enter Supabase credentials.";
      return;
    }

    const supabase = window.supabase.createClient(url, key);

    const newEntry = {
      rule_number: document.getElementById('rule-no').value,
      category: document.getElementById('category').value,
      title: document.getElementById('title').value,
      content: document.getElementById('content').value,
      rating: document.getElementById('rating').value,
      status: document.getElementById('status').value
    };

    statusMsg.style.color = '#ffb703';
    statusMsg.innerText = "Publishing...";

    const { data, error } = await supabase.from('reviews').insert([newEntry]);

    if (error) {
      statusMsg.style.color = '#ff4d4d';
      statusMsg.innerText = "Error: " + error.message;
    } else {
      statusMsg.style.color = '#4E9F3D';
      statusMsg.innerText = "Successfully published to database!";
    }
  }
</script>

</body>
</html>
